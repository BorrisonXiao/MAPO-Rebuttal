name: Build and check rebuttal viewer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viewer-checks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: site
